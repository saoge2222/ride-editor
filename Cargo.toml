[package]
name = "ride-editor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.17.1"
i-slint-core = "1.17.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.17.1"

[lib]
name = "ride_editor"
path = "crates/lib.rs"

[[bin]]
name = "ride-editor"
path = "crates/main.rs"

[[bin]]
name = "ride-fm"
path = "crates/filemngd/main.rs"
